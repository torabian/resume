# Resume content, shaped to match the entities defined in resume.emi.yml.
#
# This is plain seed/import data, not an .emi.yml definition file - it's meant
# to be loaded by whatever script populates ResumeEntity/CompanyEntity/etc.
# rows (or feeds a PDF/LaTeX renderer directly).
#
# Cross-references between sections use plain string keys instead of numeric
# ids (workExperiences[].company points at companies[].key, and every child
# section implicitly belongs to the one `resume` below) - resolve these to
# real foreign keys/UniqueIds at import time.

resume:
  fullName: Ali Torabi
  headline: Software Engineer
  summary: >
    I build digital products, share knowledge, and help others create. I'm
    deeply passionate about programming, engineering, and continuous learning
    — always pushing to master new technologies and understand how things
    work from the ground up. I enjoy bridging practical skills with digital
    innovation, from building software frameworks like Fireback to welding,
    electrical systems, and construction. For me, creating — whether it's
    code, a tool, or a physical structure — is both a craft and a lifelong
    pursuit of excellence. Started programming at age 9, I love to build and
    code constantly, which has been without stop through most of my life and
    career.


    Unique capabilities:

    - Conduct technical interviews and assess candidates during the
    recruitment process

    - Lead engineering teams or operate as a senior individual contributor
    within existing teams

    - Rescue delayed or high-risk projects by stabilizing scope and driving
    timely delivery

    - Build and deliver products from scratch as a lead developer, from
    concept to production

    - Collaborate effectively with cross-functional teams as a strong and
    reliable team player
  location: Poland
  language: en
  isPrimary: true

