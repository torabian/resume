skills:
  # Programming languages
  - key: go
    name: Go
    category: language
    level: expert
    description: >
      Extremely passionate about Go as both an ecosystem and a language —
      simple, fast, compiled, and efficient. Built and contributed to dozens
      of projects. Favorite features include cross-compiling, goroutines,
      and its simple package management system. Used most for desktop
      applications, CLI tools, shared libraries, web servers, and
      database-related tasks. Author of Fireback and EmiCompiler.

  - key: js-ts
    name: JavaScript / TypeScript
    category: language
    level: expert
    description: >
      Countless lines written across node.js, browser, electron.js, react
      native, ionic, and vanilla JavaScript, including years of jQuery and
      custom library maintenance.

  - name: PHP
    category: language
    level: advanced
    description: >
      Career-starting language (pre-2006). Used on proprietary CMS/CRM
      systems and WordPress custom theme development; later migrated a major
      commercial platform's internal services from PHP into Golang. Retired
      from day-to-day use but experience remains wide.

  - name: C
    category: language
    level: advanced
    description: >
      Used across microcontroller projects, writing reliable, memory-leak
      free code for electronic devices. Mostly focused on the esp-idf
      platform.

  # Frameworks
  - name: Angular (1...18)
    category: framework
    level: advanced
    description: >
      Started with AngularJS in plain JavaScript, shipped 2 AngularJS
      projects including build system/CLI tooling, then rewrote into
      Angular 2. Worked on many commercial projects with Angular and Angular
      Material (CDK).

  - key: react
    name: React
    category: framework
    level: expert
    description: >
      Working with React for about a decade, across many commercial
      projects and its wider ecosystem, alongside React Native.

  - key: react-native
    name: React Native
    category: framework
    level: expert
    description: >
      Involved since its early days; built dozens of apps across many
      categories over the past 10 years.

  - name: ESP-IDF
    category: framework
    level: advanced
    description: >
      Deep experience with ESP series microcontrollers using vendor SDKs.
      Advanced Wi-Fi (station/AP, provisioning, hotspot), BLE (GATT
      server/client), dual-mode connectivity for IoT, FreeRTOS-based
      development, low-power modes, OTA updates, TLS, MQTT/HTTP, peripheral
      integration (GPIO, UART, SPI, I2C, ADC), and real-time device control.

  - name: Node.js ecosystem
    category: framework
    level: expert
    description: >
      Backend-focused: pure node.js scripting, Sails.js, and later Nest.js
      (able to fully conduct an entire project in Nest.js).

  # Databases
  - name: MySQL
    category: database
    level: expert
    description: >
      Go-to database, used with PHP historically. Worked with advanced
      features and maintained databases up to 100GB. Prefers writing raw
      queries over ORM.

  - name: SQLite
    category: database
    level: advanced
    description: >
      Used in mobile applications and microcontrollers where it's the only
      viable storage option, including storing files in it. Compatible
      enough with MySQL to run similar structures on both cloud backend and
      microcontroller projects with small amounts of RAM.

  - name: MongoDB
    category: database
    level: intermediate
    description: >
      Used in a couple of projects since its inception. Comfortable with its
      strengths/limits for unknown data structures or snapshot-style data,
      though not an advanced user.

  # Libraries / tools
  - name: Cypress
    category: tool
    level: advanced
    description: >
      Used for e2e testing of front-end projects (Angular, React, websites)
      and occasionally backend integration tests.

  - name: Three.js / React Three Fiber
    category: tool
    level: advanced
    description: >
      Building interactive 3D web applications and immersive VR/AR
      experiences, dynamic scenes, and 3D model/animation integration.

  - name: Docusaurus
    category: tool
    level: advanced
    description: >
      Building and maintaining documentation platforms: versioned docs,
      custom themes/plugins, Markdown/MDX authoring, search, i18n, and
      CI/CD deployment.

  - name: Katex
    category: tool
    level: intermediate
    description: >
      Formula-writing library used in a question-bank product to replace
      embedded formula images with real typeset formulas.

  - name: Maps & Geography (Google Maps, OpenStreetMap)
    category: tool
    level: advanced
    description: >
      Custom markers, clustering, interactive overlays (polylines, polygons,
      drawing tools), geocoding/reverse geocoding, address autocomplete, and
      coordinate transformations across React, React Native, Angular, and
      vanilla JavaScript.

  - name: Jest / React Testing Library
    category: tool
    level: advanced
    description: >
      Favors testing pure logic/calculations (e.g. time-series operations)
      and component rendering logic in React and React Native.

  - name: TinyMCE
    category: tool
    level: advanced
    description: >
      Favorite rich text editor across two decades of projects; notably
      integrated Katex formula writing into it.

  # Software / design tools
  - name: Autodesk Fusion
    category: tool
    level: advanced
    description: >
      CAM/electrical design tool; able to create industrial components
      end-to-end including blueprints and toolpaths for machining parts.

  - name: KiCad
    category: tool
    level: advanced
    description: >
      Favorite open-source PCB design tool, used extensively for 2-layer PCB
      prototypes for clients and hobby work.

  # Protocols / standards / processes
  - name: MQTT
    category: protocol
    level: expert
    description: >
      Building MQTT-centric systems requiring real-time full-duplex
      communication between servers, devices, and clients; implemented both
      clients and on-premise brokers. Actively used in own products,
      including Meshora.

  - name: Bluetooth (BLE)
    category: protocol
    level: advanced
    description: >
      Bluetooth Classic and BLE across ESP microcontrollers, STM-based
      systems, Ubuntu, and React Native. GATT client/server architectures,
      device provisioning, pairing/bonding, low-level drivers and vendor
      SDKs.

  - name: E-Commerce Systems
    category: other
    level: advanced
    description: >
      WooCommerce and PrestaShop, later applied to custom-built platforms on
      Node.js and Golang: inventory management, caching strategies, custom
      fields, recursive category structures, and database modeling for
      scalable commerce.

  - name: OpenTherm
    category: protocol
    level: advanced
    description: >
      IoT protocol experience as both Master and Slave: communication
      layers, simulations, and debugging on real boiler systems.

  - name: Internationalization (i18n)
    category: other
    level: advanced
    description: >
      Building internationalized systems across web, mobile, desktop, and
      documentation platforms: RTL/LTR support, custom calendar systems, and
      multilingual database architectures for region-specific configs.

  - name: WebSocket
    category: protocol
    level: advanced
    description: >
      From early long-polling chat systems to WebSocket-based real-time
      systems for text/binary communication, load-balanced notifications,
      and audio streaming.

  - name: App Store & Google Play Management
    category: other
    level: advanced
    description: >
      Managed full application release pipelines from codebase to
      production stores: CI/CD setup, store configuration, Apple approval
      processes, and compliance requirements.

  - name: Cross-platform Data Synchronization
    category: other
    level: expert
    description: >
      One of the strongest system design skills: synchronizing data layers
      across backend, mobile, desktop, and web while preserving a unified
      API structure and offline capability, via selective API design and
      compiled Go/C components as system services.

  # Construction skills
  - name: Heating Systems (G3)
    category: other
    level: advanced
    description: >
      Design and implementation of underfloor heating, gas systems, and
      multi-room setups (Vaillant, Viessmann). Heat load calculations,
      hydraulic system design, PEX piping layouts (manifolds, pumps,
      boilers), zoned and smart control systems.

  - name: Electrical Systems (G1)
    category: other
    level: advanced
    description: >
      Residential electrical installations: circuit design, load
      calculation, panel layout, wiring, technical schematics, protective
      device selection, and safety-standard compliance.

  - name: Smart Home Systems
    category: other
    level: advanced
    description: >
      Design and implementation of smart home solutions: lighting, heating,
      and security automation; IoT devices, sensors, and controllers for
      remote access, energy optimization, and scalable systems.

