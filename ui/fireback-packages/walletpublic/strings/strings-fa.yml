extends: []
content:
  help:
    myWallets: کیف‌پول‌های خودتان، یکی برای هر ارزی که در آن تخصیص یافته‌اید (یا اگر
      ایجاد خودکار کیف‌پول فعال باشد، خودتان ایجاد کرده‌اید). موجودی فقط از طریق شارژ،
      خرید، انتقال کاربر به کاربر، یا بازخرید کارت هدیه پیش‌پرداخت تغییر می‌کند -
      هرگز مستقیماً قابل ویرایش نیست. برای افزودن وجه از طریق یک درگاه پرداخت، دکمه
      «شارژ» را روی هر ردیف بزنید؛ برای دیدن تاریخچه کامل تراکنش‌های یک کیف‌پول، آن
      را باز کنید.
    walletHistory: دفترکل فقط‌خواندنی و تنها-افزایشی هر تغییر موجودی در این کیف‌پول
      - شارژها، خریدها، انتقال‌های ورودی یا خروجی، بازخریدهای کارت هدیه، بازپرداخت‌ها،
      و هر تعدیل دستی که یک مدیر انجام داده، هرکدام با جهت، مبلغ و موجودی جاری خودشان.
      هیچ‌چیز در اینجا قابل ویرایش یا حذف نیست - اگر چیزی نیاز به اصلاح داشته باشد،
      به‌جای آن یک ردیف جبرانی جدید افزوده می‌شود، بنابراین این تاریخچه همیشه داستان
      واقعی چگونگی رسیدن موجودی به وضعیت فعلی‌اش را روایت می‌کند.
