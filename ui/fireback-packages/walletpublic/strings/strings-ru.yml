extends: []
content:
  help:
    myWallets: Ваши собственные кошельки, по одному на каждую валюту, в которой вы
      были подключены (или которую создали самостоятельно, если включено самостоятельное
      создание кошельков). Баланс меняется только через пополнение, покупку, перевод
      между пользователями или погашение подарочной карты - его никогда нельзя редактировать
      напрямую. Используйте кнопку «Пополнить» в любой строке, чтобы добавить средства
      через платёжный шлюз; откройте кошелёк, чтобы увидеть его полную историю транзакций.
    walletHistory: Журнал только для чтения и только для добавления для каждого изменения
      баланса этого кошелька - пополнения, покупки, входящие и исходящие переводы,
      погашения подарочных карт, возвраты и любые ручные корректировки, сделанные
      администратором, каждая со своим направлением, суммой и текущим балансом. Здесь
      ничего нельзя редактировать или удалять - если что-то нужно исправить, вместо
      этого добавляется новая компенсирующая запись, поэтому история всегда правдиво
      показывает, как баланс пришёл к текущему состоянию.
  myWallets:
    amount: Сумма
    amountHint: Сумма пополнения в виде десятичной строки в минимальных единицах (например,
      центы для USD).
    archiveTitle: Мои кошельки
    attemptCreated: 'Попытка платежа создана, статус:'
    back: Назад к моим кошелькам
    balance: Баланс
    balanceAfter: Баланс после операции
    clientSecretNotice: Этому шлюзу требуется дополнительный шаг подтверждения в браузере,
      который здесь пока не реализован - попытка платежа создана, но её нужно завершить
      другим способом.
    createDisabled: Создание собственного кошелька сейчас отключено. Обратитесь к
      администратору, если вам нужен новый.
    createdAt: Дата
    currency: Валюта
    direction: Направление
    directionCredit: Пополнение
    directionDebit: Списание
    gateway: Платёжный шлюз
    historyTitle: История операций
    isDefault: По умолчанию
    label: Метка
    newWallet: Новый кошелёк
    noGatewayForCurrency: В данный момент ни один платёжный шлюз не поддерживает валюту
      этого кошелька.
    note: Заметка
    ownerType: Владелец
    ownerUser: Вы
    ownerWorkspace: Рабочее пространство
    reason: Причина
    redirecting: Переадресация на платёжный шлюз...
    returnUrl: URL возврата
    returnUrlHint: Куда вернуть вас после завершения оплаты. Обязательно для шлюзов,
      перенаправляющих браузер для завершения оплаты.
    selectGateway: Выберите способ оплаты...
    status: Статус
    submit: Начать пополнение
    submitting: Запуск...
    success: Пополнение начато.
    topUp: Пополнить
    topupDescription: Пополните этот кошелёк через платёжный шлюз.
    topupTitle: Пополнение кошелька
    view: Просмотр
    wallet: Кошелёк
