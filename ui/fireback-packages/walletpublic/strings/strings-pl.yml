extends: []
content:
  help:
    myWallets: Twoje własne portfele, po jednym na każdą walutę, w której zostałeś
      skonfigurowany (lub który sam utworzyłeś, jeśli samodzielne tworzenie portfela
      jest włączone). Saldo zmienia się wyłącznie przez doładowanie, zakup, przelew
      między użytkownikami lub realizację karty podarunkowej - nigdy nie można go
      edytować bezpośrednio. Użyj przycisku "Doładuj" przy dowolnym wierszu, aby dodać
      środki przez bramkę płatniczą; otwórz portfel, aby zobaczyć jego pełną historię
      transakcji.
    walletHistory: Tylko do odczytu, przeznaczony wyłącznie do dopisywania rejestr
      każdej zmiany salda tego portfela - doładowania, zakupy, przelewy przychodzące
      i wychodzące, realizacje kart podarunkowych, zwroty oraz każda ręczna korekta
      wprowadzona przez administratora, każda z własnym kierunkiem, kwotą i bieżącym
      saldem. Nic tu nie można edytować ani usuwać - jeśli coś wymaga korekty, dodawany
      jest zamiast tego nowy, kompensujący wpis, dzięki czemu historia zawsze prawdziwie
      opowiada, jak saldo doszło do obecnego stanu.
