content:
  regionalContents:
    archiveTitle: Regional contents
    editRegionalContent: Edit regional content
    newRegionalContent: New regional content
    keyGroup: Key group
    keyGroupHint: Which kind of message this content is used for.
    keyGroupSmsOtp: SMS one-time password
    keyGroupEmailOtp: Email one-time password
    region: Region
    regionHint: Region or locale this content applies to, for example any, us, eu, or asia/*. Use any unless you need to target a specific region.
    uniqueId: Id
    definitionsTitle: Definitions
    definitionsHint: One entry per language this content is translated into. Save this record first to start adding definitions.
    addDefinition: Add definition
    newDefinition: New definition
    editDefinition: Edit definition
    noDefinitions: No definitions yet. Add one to give this content actual text.
    locale: Locale
    localeHint: Language code this definition is written in, for example en, fa, or pl. Falls back to English if nothing matches a user's language.
    title: Title
    titleHint: Optional subject line - only used for email-type content.
    content: Content
    contentHint: The template body sent to the user. Supports Go template syntax to insert dynamic values, such as {{.Otp}} for the one-time password.
    deleteDefinitionConfirmTitle: Delete definition
    deleteDefinitionConfirmDescription: Are you sure you want to delete the "{locale}" definition? This cannot be undone.
    definitionCreated: Definition created
    definitionUpdated: Definition updated
    definitionDeleted: Definition deleted
