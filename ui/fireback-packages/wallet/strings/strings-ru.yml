extends: []
content:
  help:
    prepaids: Подарочные карты, выпущенные root - каждая погашается ровно один раз,
      на свою фиксированную номинальную стоимость, в своей фиксированной валюте. Карта
      может опционально быть ограничена одним рабочим пространством («Рабочее пространство»)
      - тогда она будет погашаться только в кошелёк, принадлежащий именно этому рабочему
      пространству. Карта также может опционально быть привязана к «Обеспечивающему
      казначейству» - если оно задано, погашение списывает средства с кошелька этого
      казначейства вместо создания новой стоимости, делая это настоящим переводом,
      а не появлением средств из ниоткуда; оставьте пустым для карты, которая просто
      должна создавать стоимость (например, промо-подарок). «Ключ погашения» генерируется
      автоматически, если оставлен пустым при создании, и никогда не должен редактироваться
      впоследствии - это единственный секрет, который вообще делает карту погашаемой.
    treasuries: Казначейство - это именованный указатель на один кошелёк, не более
      того. Его собственная строка никогда сама не перемещает деньги; используйте
      «Пополнить казначейство» (только root, всегда требует причину), чтобы действительно
      зачислить средства на связанный кошелёк, а подарочные карты могут опционально
      списывать с него средства при погашении (см. собственное описание prepaids)
      вместо создания новой стоимости. Связанный кошелёк никогда нельзя изменить после
      создания казначейства, так как через него уже могли пройти средства - если нужно
      указать другой кошелёк, создайте вместо этого новое казначейство.
    walletCurrencies: Валюты, в которых можно создавать кошельки. «Разряды» (Decimals)
      фиксируют точность минимальной единицы, в которой любая сумма в этой валюте
      выражается впредь (например, 2 для USD, значит «10050» означает $100.50, 8 для
      BTC) - настройте это правильно до того, как кто-либо начнёт использовать валюту,
      поскольку каждый кошелёк/транзакция/попытка платежа в ней трактуется с этой
      же точностью навсегда. Отключение «Активна» блокирует новые кошельки/пополнения
      в этой валюте, но не затрагивает уже существующие в ней кошельки.
    walletEvents: 'Необработанный журнал аудита входящих вебхуков от каждого платёжного
      шлюза - только для чтения, одна строка на каждый полученный колбэк, независимо
      от того, был ли он сопоставлен с известной попыткой платежа или успешно обработан.
      Полезно при диагностике пополнения, которое так и не завершилось: «Ошибка обработки»
      объясняет, почему конкретное событие было отклонено или проигнорировано, а «Payload»
      - это точные данные, отправленные шлюзом.'
    walletGateways: Платёжные провайдеры, через которые владельцы кошельков могут
      пополнять баланс (Stripe, Przelewy24, BLIK, ZarinPal или собственный тестовый
      провайдер этого проекта). «Конфигурация» (Config) должна содержать только ссылки
      на секреты (например, имя ключа в менеджере секретов) - никогда не сырой API-ключ
      или секрет вебхука в открытом виде. «Поддерживаемые валюты» сужает, для каких
      валют форма пополнения реально предложит этот шлюз. Отключение «Активен» скрывает
      шлюз от новых пополнений, не затрагивая уже выполняющиеся через него попытки
      платежа.
    walletPaymentAttempts: Каждая попытка владельца кошелька переместить деньги через
      платёжный шлюз - только для чтения, для поддержки/диагностики. «Назначение»
      (Purpose) - пополнение, покупка или вывод средств; «Статус» отслеживает собственный
      жизненный цикл (ожидание, успех, ошибка, отменена, ...) независимо от того,
      была ли для неё создана запись в журнале walletTransaction - такая запись есть
      только у успешной попытки.
    walletProviderConfigs: Доступная только root, не содержащая секретов конфигурация
      одного адаптера платёжного провайдера для одного региона - не более одной строки
      на пару (тип провайдера, регион). «Тип провайдера» должен совпадать с кодом
      зарегистрированного адаптера (stripe, przelewy24, blik, zarinpal, ...); «Регион»
      - код в стиле ISO-3166 или «global» для всех регионов. Это отдельно от собственного
      поля «Конфигурация» строки walletGateway - там настройки интеграции на стороне
      провайдера, а здесь то, что конкретное предложение шлюза показывает владельцам
      кошельков.
    walletTransactions: 'Журнал истории баланса только для добавления - одна строка
      записывается каждый раз, когда баланс любого кошелька меняется (пополнение,
      покупка, возврат, корректировка, перевод, погашение подарочной карты, пополнение
      казначейства, комиссия, chargeback), всегда в той же транзакции базы данных,
      что и само обновление баланса, поэтому этот список и текущий баланс кошелька
      никогда не могут разойтись. Только для чтения: запись журнала никогда не редактируется
      и не удаляется после создания - исправление всегда является новой компенсирующей
      записью, а не редактированием старой. «Причина» (Reason) - тип события, породившего
      строку; «Тип ссылки»/«Id ссылки» указывают на то, что её вызвало (попытку платежа,
      подарочную карту, казначейство, другой кошелёк при переводе, ...).'
    wallets: Все кошельки в системе, для всех владельцев - кошелёк создаётся для пользователя
      (ownerType «user»), рабочего пространства (ownerType «workspace») или для конкретного
      пользователя в рамках конкретного рабочего пространства (ownerType «workspaceUser»,
      например чтобы подарочной карте, ограниченной рабочим пространством, было куда
      быть погашенной). Баланс никогда не редактируется напрямую здесь - он меняется
      только через пополнение, покупку, перевод, погашение подарочной карты или экран
      «Корректировка баланса» (ручная корректировка службой поддержки/операционным
      отделом, всегда с записанной причиной). «Заморожен» (Frozen) - более сильная
      блокировка, доступная только root, поверх статуса - она останавливает любое
      изменение баланса независимо от статуса и устанавливается/снимается только со
      страницы деталей самого кошелька. Кошелёк можно удалить только при нулевом балансе
      и при отсутствии хотя бы одной записи в журнале транзакций - иначе закройте
      его (статус «closed»).
