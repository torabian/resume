extends: []
content:
  help:
    prepaids: کارت‌های هدیه پیش‌پرداخت صادرشده توسط روت - هر کدام دقیقاً یک بار، با
      ارزش اسمی ثابت خودشان، در ارز ثابت خودشان قابل بازخرید هستند. یک کارت می‌تواند
      اختیاراً به یک فضای‌کاری («فضای‌کاری») محدود شود - در این صورت فقط در کیف‌پولی
      متعلق به دقیقاً همان فضای‌کاری بازخرید می‌شود. یک کارت همچنین می‌تواند اختیاراً
      به یک «خزانه پشتیبان» متصل شود - وقتی تنظیم شده، بازخرید کیف‌پول همان خزانه
      را بدهکار می‌کند به‌جای ضرب ارزش جدید، که آن را به یک انتقال واقعی تبدیل می‌کند
      نه پول ظاهرشده از هیچ‌جا؛ برای کارتی که فقط قرار است ارزش ایجاد کند (مثلاً یک
      هدیه تبلیغاتی) آن را خالی بگذارید. «کلید بازخرید» اگر هنگام ایجاد خالی گذاشته
      شود به‌طور خودکار تولید می‌شود، و هرگز نباید پس از آن ویرایش شود - این تنها
      رازی است که یک کارت را اصلاً قابل بازخرید می‌کند.
    treasuries: یک خزانه یک اشاره‌گر نام‌دار به یک کیف‌پول است - نه چیزی بیشتر. ردیف
      خودش هرگز مستقیماً پول جابه‌جا نمی‌کند؛ از «شارژ خزانه» (فقط‌روت، همیشه نیازمند
      یک یادداشت) برای واقعاً بستانکار کردن کیف‌پول متصل به آن استفاده کنید، و کارت‌های
      هدیه پیش‌پرداخت می‌توانند اختیاراً هنگام بازخرید آن را بدهکار کنند (به راهنمای
      خود prepaids مراجعه کنید) به‌جای ضرب ارزش جدید. کیف‌پول متصل هرگز پس از ایجاد
      یک خزانه قابل تغییر نیست، چون ممکن است وجوهی از قبل از طریق آن جابه‌جا شده باشد
      - اگر نیاز به اشاره به کیف‌پول دیگری دارید، به‌جای آن یک خزانه جدید ایجاد کنید.
    walletCurrencies: ارزهایی که کیف‌پول‌ها می‌توانند در آن‌ها ایجاد شوند. «اعشار
      (Decimals)» دقت واحد فرعی هر مبلغ در آن ارز را برای همیشه تعیین می‌کند (مثلاً
      ۲ برای دلار یعنی «10050» برابر با ۱۰۰.۵۰ دلار است، ۸ برای بیت‌کوین) - پیش از
      استفاده هر کسی از این ارز، این مقدار را درست تنظیم کنید، چون هر کیف‌پول/تراکنش/تلاش
      پرداخت در آن ارز برای همیشه با همین دقت تفسیر می‌شود. غیرفعال کردن «فعال» مانع
      کیف‌پول/شارژ جدید در این ارز می‌شود، اما به کیف‌پول‌های موجود در آن دست نمی‌زند.
    walletEvents: 'لاگ ممیزی خام webhook‌های ورودی از هر درگاه پرداخت - فقط‌خواندنی،
      یک ردیف برای هر بازخوانی دریافتی، چه با یک تلاش پرداخت شناخته‌شده مطابقت داشته
      باشد چه پردازش موفق شده باشد یا نه. برای عیب‌یابی یک شارژ که هرگز کامل نشده
      مفید است: «خطای پردازش» توضیح می‌دهد چرا یک رویداد خاص رد یا نادیده گرفته شده،
      و «بار داده (Payload)» دقیقاً داده‌ای است که درگاه ارسال کرده.'
    walletGateways: درگاه‌های پرداختی که مالکان کیف‌پول می‌توانند از طریق آن‌ها شارژ
      کنند (Stripe، Przelewy24، BLIK، زرین‌پال، یا درگاه تستی ساختگی خود این پروژه).
      «پیکربندی (Config)» باید فقط حاوی ارجاع به رازها باشد (مثلاً نام یک کلید در
      مدیریت رازها) - هرگز کلید API یا راز webhook خام به‌صورت متن ساده. «ارزهای پشتیبانی‌شده»
      مشخص می‌کند فرم شارژ واقعاً این درگاه را برای کدام ارزها ارائه می‌دهد. غیرفعال
      کردن «فعال» یک درگاه را از شارژهای جدید پنهان می‌کند، بدون تأثیر بر تلاش‌های
      پرداختی که در حال حاضر از طریق آن در جریان هستند.
    walletPaymentAttempts: هر تلاشی که مالک یک کیف‌پول برای جابه‌جایی پول از طریق
      یک درگاه پرداخت انجام داده - فقط‌خواندنی، برای پشتیبانی/عیب‌یابی. «هدف (Purpose)»
      شارژ، خرید یا برداشت است؛ «وضعیت» چرخه عمر خود را (در انتظار، موفق، ناموفق،
      لغوشده، ...) مستقل از اینکه آیا یک ردیف دفترکل walletTransaction برای آن ایجاد
      شده یا نه دنبال می‌کند - فقط یک تلاش موفق چنین ردیفی دارد.
    walletProviderConfigs: پیکربندی فقط‌روت و بدون‌راز برای یک آداپتور ارائه‌دهنده
      پرداخت در یک منطقه - حداکثر یک ردیف برای هر جفت (نوع ارائه‌دهنده، منطقه). «نوع
      ارائه‌دهنده» باید با کد یک آداپتور ثبت‌شده مطابقت داشته باشد (stripe، przelewy24،
      blik، zarinpal، ...)؛ «منطقه» یک کد شبیه ISO-3166 است، یا «global» برای همه
      جا. این با فیلد «پیکربندی» خود یک ردیف درگاه (walletGateway) متفاوت است - آن
      یکی تنظیمات یکپارچه‌سازی سمت ارائه‌دهنده است، این یکی چیزی است که یک پیشنهاد
      درگاه خاص به مالکان کیف‌پول نشان می‌دهد.
    walletTransactions: 'دفترکل تنها-افزایشی تاریخچه موجودی - هر بار موجودی هر کیف‌پول
      تغییر می‌کند (شارژ، خرید، بازپرداخت، تعدیل، انتقال، بازخرید کارت هدیه، شارژ
      خزانه، کارمزد، برگشت‌خورد) یک ردیف نوشته می‌شود، همیشه در همان تراکنش پایگاه‌داده
      به‌همراه خود به‌روزرسانی موجودی، پس این لیست و موجودی فعلی یک کیف‌پول هرگز نمی‌توانند
      از هم واگرا شوند. فقط‌خواندنی: یک ردیف دفترکل هرگز پس از ایجاد ویرایش یا حذف
      نمی‌شود - اصلاح همیشه یک ردیف جدید و متقابل است، نه ویرایش یک ردیف قدیمی. «دلیل
      (Reason)» نوع رویدادی است که این ردیف را تولید کرده؛ «نوع مرجع»/«شناسه مرجع»
      به هر آنچه باعث آن شده اشاره می‌کند (یک تلاش پرداخت، یک کارت هدیه، یک خزانه،
      کیف‌پول دیگر در یک انتقال، ...).'
    wallets: هر کیف‌پول موجود در سیستم، برای همه مالکان - یک کیف‌پول برای یک کاربر
      (ownerType «user»)، یک فضای‌کاری (ownerType «workspace»)، یا یک کاربر خاص محدود
      به یک فضای‌کاری خاص (ownerType «workspaceUser»، مثلاً برای اینکه یک کارت هدیه
      محدود به یک فضای‌کاری، جایی برای بازخرید شدن داشته باشد) ایجاد می‌شود. موجودی
      هرگز مستقیماً از اینجا ویرایش نمی‌شود - فقط از طریق شارژ، خرید، انتقال، بازخرید
      کارت هدیه، یا صفحه «تعدیل موجودی» (یک اصلاح دستی پشتیبانی/عملیاتی، که همیشه
      با یک یادداشت ثبت می‌شود) تغییر می‌کند. «مسدود (Frozen)» یک محدودیت قوی‌تر و
      فقط‌روت، فراتر از وضعیت است - جلوی هر تغییر موجودی را صرف‌نظر از وضعیت می‌گیرد،
      و فقط از صفحه جزئیات خود کیف‌پول قابل تنظیم/رفع است. یک کیف‌پول فقط زمانی قابل
      حذف است که موجودی صفر داشته باشد و هیچ‌گاه هیچ تراکنش دفترکلی ثبت نکرده باشد
      - در غیر این صورت به‌جای حذف، آن را ببندید (وضعیت «بسته»).
