extends: []
content:
  help:
    prepaids: Karty podarunkowe wydane przez roota - każda możliwa do zrealizowania
      dokładnie raz, o własnej stałej wartości nominalnej, we własnej stałej walucie.
      Karta może opcjonalnie być ograniczona do jednej przestrzeni roboczej ("Przestrzeń
      robocza") - wtedy zrealizuje się wyłącznie w portfelu należącym do dokładnie
      tej przestrzeni roboczej. Karta może też opcjonalnie być powiązana ze "Skarbcem
      zasilającym" - gdy ustawiony, realizacja obciąża portfel tego skarbca zamiast
      tworzyć nową wartość, co czyni to prawdziwym przelewem, a nie środkami znikąd;
      pozostaw puste dla karty, która ma po prostu tworzyć wartość (np. prezent promocyjny).
      "Klucz realizacji" jest generowany automatycznie, jeśli pozostawiony pusty przy
      tworzeniu, i nigdy nie powinien być edytowany później - to jedyny sekret, który
      w ogóle czyni kartę możliwą do zrealizowania.
    treasuries: Skarbiec to nazwany wskaźnik do jednego portfela - nic więcej. Jego
      własny wiersz nigdy sam nie przesuwa środków; użyj "Zasil skarbiec" (tylko root,
      zawsze wymaga notatki), aby faktycznie uznać powiązany portfel, a karty podarunkowe
      mogą opcjonalnie obciążać go przy realizacji (patrz własny opis prepaids) zamiast
      tworzyć nową wartość. Powiązanego portfela nigdy nie można zmienić po utworzeniu
      skarbca, ponieważ środki mogły już przez niego przepłynąć - jeśli potrzebujesz
      wskazać inny portfel, utwórz zamiast tego nowy skarbiec.
    walletCurrencies: Waluty, w których można tworzyć portfele. "Miejsca dziesiętne"
      (Decimals) ustalają precyzję jednostki podrzędnej, w jakiej każda kwota w tej
      walucie jest wyrażana od tej pory (np. 2 dla USD, więc "10050" oznacza 100,50
      USD, 8 dla BTC) - ustaw to poprawnie, zanim ktokolwiek zacznie używać waluty,
      ponieważ każdy portfel/transakcja/próba płatności w niej jest interpretowana
      z tą samą precyzją na zawsze. Wyłączenie "Aktywna" blokuje nowe portfele/doładowania
      w tej walucie, ale nie dotyka portfeli, które już w niej istnieją.
    walletEvents: 'Surowy dziennik audytowy przychodzących webhooków z każdej bramki
      płatniczej - tylko do odczytu, jeden wiersz na otrzymane wywołanie zwrotne,
      niezależnie od tego, czy dopasowano je do znanej próby płatności, czy przetworzono
      pomyślnie. Przydatne przy diagnozowaniu doładowania, które nigdy się nie ukończyło:
      "Błąd przetwarzania" wyjaśnia, dlaczego konkretne zdarzenie zostało odrzucone
      lub zignorowane, a "Payload" to dokładne dane wysłane przez bramkę.'
    walletGateways: Dostawcy płatności, przez których właściciele portfeli mogą się
      doładowywać (Stripe, Przelewy24, BLIK, ZarinPal lub własny testowy dostawca
      tego projektu). "Konfiguracja" (Config) może zawierać wyłącznie odniesienia
      do sekretów (np. nazwę klucza w menedżerze sekretów) - nigdy surowego klucza
      API ani sekretu webhooka w postaci jawnej. "Obsługiwane waluty" zawęża, dla
      jakich walut formularz doładowania faktycznie oferuje tę bramkę. Wyłączenie
      "Aktywna" ukrywa bramkę przed nowymi doładowaniami, nie wpływając na próby płatności
      już będące w toku przez nią.
    walletPaymentAttempts: Każda próba podjęta przez właściciela portfela w celu przesunięcia
      środków przez bramkę płatniczą - tylko do odczytu, do celów wsparcia/diagnostyki.
      "Cel" (Purpose) to doładowanie, zakup lub wypłata; "Status" śledzi własny cykl
      życia (oczekująca, udana, nieudana, anulowana, ...) niezależnie od tego, czy
      dla niej powstał wpis rejestru walletTransaction - taki wpis ma tylko udana
      próba.
    walletProviderConfigs: Nieszyfrowana, dostępna tylko dla roota konfiguracja jednego
      adaptera dostawcy płatności w jednym regionie - co najwyżej jeden wiersz na
      parę (typ dostawcy, region). "Typ dostawcy" musi pasować do kodu zarejestrowanego
      adaptera (stripe, przelewy24, blik, zarinpal, ...); "Region" to kod w stylu
      ISO-3166 lub "global" dla wszystkich regionów. Jest to odrębne od pola "Konfiguracja"
      samego wiersza walletGateway - tamto to ustawienia integracji po stronie dostawcy,
      to jest to, co konkretna oferta bramki pokazuje właścicielom portfeli.
    walletTransactions: 'Rejestr historii salda przeznaczony wyłącznie do dopisywania
      - jeden wiersz jest zapisywany za każdym razem, gdy zmienia się saldo dowolnego
      portfela (doładowanie, zakup, zwrot, korekta, przelew, realizacja karty podarunkowej,
      zasilenie skarbca, opłata, chargeback), zawsze w tej samej transakcji bazodanowej
      co sama aktualizacja salda, więc ta lista i bieżące saldo portfela nigdy nie
      mogą się rozjechać. Tylko do odczytu: wpis rejestru nigdy nie jest edytowany
      ani usuwany po utworzeniu - korekta to zawsze nowy, kompensujący wpis, nigdy
      edycja starego. "Powód" (Reason) to rodzaj zdarzenia, które wygenerowało wiersz;
      "Typ referencji"/"Id referencji" wskazują z powrotem na to, co go spowodowało
      (próbę płatności, kartę podarunkową, skarbiec, inny portfel w przelewie, ...).'
    wallets: Każdy portfel w systemie, dla każdego właściciela - portfel jest tworzony
      dla użytkownika (ownerType "user"), przestrzeni roboczej (ownerType "workspace")
      lub jednego konkretnego użytkownika przypisanego do jednej konkretnej przestrzeni
      roboczej (ownerType "workspaceUser", np. aby karta podarunkowa ograniczona do
      przestrzeni roboczej miała gdzie zostać zrealizowana). Saldo nigdy nie jest
      edytowane bezpośrednio tutaj - zmienia się wyłącznie przez doładowanie, zakup,
      przelew, realizację karty podarunkowej lub ekran "Koryguj saldo" (ręczna korekta
      wsparcia/operacyjna, zawsze rejestrowana z notatką). "Zablokowany" (Frozen)
      to silniejsza, dostępna tylko dla roota blokada ponad statusem - zatrzymuje
      każdą zmianę salda niezależnie od statusu i można ją ustawić/zdjąć wyłącznie
      z ekranu szczegółów portfela. Portfel można usunąć tylko wtedy, gdy ma zerowe
      saldo i nigdy nie zarejestrował żadnej transakcji księgowej - w przeciwnym razie
      zamknij go (status "closed").
