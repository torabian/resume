actions:
- name: resumeToLatex
  cliShort: to-latex
  url: /profile/:uniqueId/latex
  method: get
  description: Renders one resume into LaTeX source - see ResumeLatexDto's own doc
    comment for exactly what's covered in this first pass.
  out:
    envelope: GResponse
    dto: ResumeLatexDto
- name: companyCreate
  cliName: create
  cliShort: c
  url: /company
  method: post
  description: Creates a new "company" row.
  in:
    dto: CompanyDto
  out:
    envelope: GResponse
    dto: CompanyDto
- name: companyUpdate
  cliName: update
  cliShort: u
  url: /company/:uniqueId
  method: patch
  description: Applies a partial update to a "company" row by uniqueId.
  in:
    dto: CompanyOptionalDto
  out:
    envelope: GResponse
    dto: CompanyDto
- name: companyGet
  cliName: get
  cliShort: g
  url: /company/:uniqueId
  method: get
  description: Looks up a single "company" row by uniqueId.
  out:
    envelope: GResponse
    dto: CompanyDto
- name: companyBrowse
  cliName: browse
  cliShort: b
  url: /company/browse
  method: get
  qs:
  - name: filter
    type: string
  - name: sort
    type: string
  - name: startIndex
    type: int
  - name: itemsPerPage
    type: int
  - name: cursor
    type: string
  description: Returns "company" rows matching a filter, sorted/paged (see emigorm.ApplyQueryFilter/ApplyQueryScope).
  out:
    envelope: GResponse
    dto: CompanyOptionalDto
- name: companyAwareDeletePreview
  cliName: delete-preview
  cliShort: dp
  url: /company/delete-preview
  method: get
  qs:
  - name: uniqueIds
    type: slice
    primitive: string
  description: Reports what deleting the given "company" uniqueIds would affect, without
    deleting anything.
  out:
    envelope: GResponse
    fields:
    - name: message
      type: string
    - name: affected
      type: array
      fields:
      - name: relation
        type: string
      - name: count
        type: int64
- name: companyAwareDelete
  cliName: delete
  cliShort: d
  url: /company/delete
  method: post
  description: Deletes the given "company" uniqueIds, along with everything companyAwareDeletePreview
    reports.
