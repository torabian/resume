targets:
- compiler: js
  flags:
    js-sdk-location: '@fireback/js-remote-ctx'
  output: ../../ui/src/modules/resume/sdk
  tags:
  - typescript
  - react
  - json-schema
  - no-sdk
  - no-package
- compiler: go
  flags:
    pkg: resumedefs
  output: ./defs
- compiler: preprocessor
  output: .
description: |
  Resume module - stores a resume structurally in the database so it can be
  edited via CRUD and later rendered into PDF/LaTeX (or any other format).

  Layout: `Resume` is the root aggregate holding profile-level info (name,
  headline, summary, contact details). Every resume section is its own
  top-level entity (Company, WorkExperience, Education, Skill, Project,
  Certification, Language) so each has full CRUD/CLI/HTTP generated for it
  and can be edited independently.

  Ownership is modeled child -> parent: each section entity carries a
  `resume: one target: ResumeEntity` field (its ResumeId foreign key), so a
  resume's sections are fetched with Browse filtered by resumeId rather than
  through a many-to-many `collection` field on Resume itself (a resume "has
  many" work experiences, it doesn't share them with other resumes).

  Company is the one exception: it's a standalone reusable entity (the same
  employer can back multiple WorkExperience rows, even across resumes), so
  WorkExperience links to it via `company: one? target: CompanyEntity`.

  Translatable fields: any free-text *content* field (a title, a summary, a
  description, a location) is `complex(?): TString` (see
  ../definitions/complexes.emi.yml) - a locale -> value map, so one Resume
  row can carry both an English and a Persian rendering of the same field
  instead of needing a whole separate resume per language. Proper
  nouns/identifiers (a person's fullName, a company's legal name, a skill or
  project's own name, an institution, urls/emails/ids, enums) stay plain
  `string(?)` - they aren't translated, they're the same value in every
  language. String *slices* (achievements, technologies, highlights) are
  left alone too, even where individual bullets are genuinely translatable
  prose - TString has no array counterpart here without a bigger structural
  change (each item becoming its own array/collection child row) than this
  pass covers.

  Dates: every `startDate`/`endDate` pair (workExperience, education,
  project) is `complex(?): XDate` (see ../definitions/complexes.emi.yml) -
  same locale-agnostic parse/format/persian-calendar handling every other
  XDate field in this codebase gets (e.g. ../../../nima/modules/entitlement/
  Entitlement.emi.yml's own startDate/endDate), stored as a real SQL `date`
  column instead of free text. `issueDate`/`expirationDate` on certification
  are left plain `string(?)` for now - not touched by this pass.
name: resume
dtos:
- description: 'Plain LaTeX (.tex) source generated for one resume - the profile fields
    (fullName/headline/summary/contact info) plus the skills and projects picked for
    it via the Resume Creator screen (see `resume.content` and ui/src/modules/resume/ResumeCreator.tsx).
    First pass only: raw source text, not a compiled PDF - see ResumeToLatexImplementation.go''s
    own doc comment for what a later pass would still need (a real LaTeX toolchain,
    a proper template/theme, work experience/education/certifications/languages -
    none of which `content` references today).'
  name: resumeLatex
  fields:
  - name: source
    description: The complete .tex document, ready to hand to a LaTeX compiler as-is.
    type: string
- description: Every field of the "company" entity, but optional - used both as Update's
    partial input and as Browse's response item shape.
  name: companyOptional
  fields:
